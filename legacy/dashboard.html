<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0">

<title>
ARTHORXMITH Dashboard
</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial,sans-serif;

    background:#f4f6f9;

    padding:20px;
}

.container{

    max-width:1200px;

    margin:auto;
}

.card{

    background:#fff;

    border-radius:20px;

    padding:20px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.1);
}

.profile{

    text-align:center;
}

#avatar{

    width:120px;

    height:120px;

    border-radius:50%;

    border:4px solid #eee;

    margin-bottom:15px;
}

.stats{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                180px,
                1fr
            )
        );

    gap:15px;

    margin-top:20px;
}

.stat-box{

    background:#f8f9fa;

    border-radius:10px;

    padding:15px;

    text-align:center;
}

.menu{

    margin-top:30px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                220px,
                1fr
            )
        );

    gap:15px;
}

.menu a{

    text-decoration:none;

    background:#ffffff;

    color:#333;

    border:1px solid #ddd;

    border-radius:10px;

    padding:20px;

    text-align:center;

    font-weight:bold;

    transition:.2s;
}

.menu a:hover{

    transform:translateY(-2px);

    background:#f2f2f2;
}

.logout{

    margin-top:30px;

    text-align:center;
}

button{

    border:none;

    background:#dc3545;

    color:#fff;

    padding:12px 25px;

    border-radius:10px;

    cursor:pointer;
}

.role{

    color:#007bff;

    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">


<div class="card">

    <div class="profile">

        <img
            id="avatar"
            src="">

        <h2
            id="displayName">
        </h2>

        <p
            id="email">
        </p>

        <p>

            Role :

            <span
                id="role"
                class="role">
            </span>

        </p>

    </div>

    <div class="stats">

        <div class="stat-box">

            <h3>Gold</h3>

            <div id="gold">
                0
            </div>

        </div>

        <div class="stat-box">

            <h3>Diamond</h3>

            <div id="diamond">
                0
            </div>

        </div>

        <div class="stat-box">

            <h3>Level</h3>

            <div id="level">
                1
            </div>

        </div>

        <div class="stat-box">

            <h3>EXP</h3>

            <div id="exp">
                0
            </div>

        </div>

    </div>

    <div
        id="menu"
        class="menu">
    </div>

    <div class="logout">

        <button
            id="logoutBtn">

            Logout

        </button>

    </div>

</div>


</div>

<script
    type="module"
    src="./js/auth.js">
</script>

<script type="module">

import {
    auth,
    db
}
from "./js/firebase.js";

import {
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    ref,
    get
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

onAuthStateChanged(
    auth,
    async(user)=>
    {
        if(!user)
        {
            return;
        }

        const snapshot =
            await get(
                ref(
                    db,
                    "users/" +
                    user.uid
                )
            );

        const profile =
            snapshot.val();

        document
            .getElementById(
                "gold"
            )
            .innerText =
            profile.gold || 0;

        document
            .getElementById(
                "diamond"
            )
            .innerText =
            profile.diamond || 0;

        document
            .getElementById(
                "level"
            )
            .innerText =
            profile.level || 1;

        document
            .getElementById(
                "exp"
            )
            .innerText =
            profile.exp || 0;
    }
);

</script>

</body>

</html>

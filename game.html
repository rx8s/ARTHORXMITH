<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — ARTHORXMITH</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚜️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-nav"></header>
  <main>
    <h1 class="page-title">🏰 <span id="welcome-title">Welcome back</span></h1>

    <section class="panel">
      <div class="stat-tiles" id="stat-tiles"></div>
      <div class="exp-bar" style="margin-top:14px" title="Account EXP">
        <div class="exp-fill" id="account-exp" style="width:0%"></div>
      </div>
      <p class="muted" id="exp-caption" style="font-size:0.82rem;margin:6px 0 0"></p>
    </section>

    <div class="grid-2" style="margin-top:20px">
      <section class="panel">
        <div class="row spread">
          <h2>⚔️ Enter Battle</h2>
        </div>
        <p class="muted" id="deck-hint"></p>
        <div class="difficulty-row" id="difficulty-row"></div>
      </section>

      <section class="panel">
        <div class="row spread">
          <h2>🃏 Battle Deck</h2>
          <a class="btn btn-sm" href="deck.html">Edit Deck</a>
        </div>
        <div class="card-grid" id="deck-preview"></div>
      </section>
    </div>
  </main>
  <script type="module" src="js/pages/game.js"></script>
</body>
</html>

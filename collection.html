<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection — ARTHORXMITH</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚜️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-nav"></header>
  <main>
    <h1 class="page-title">📚 Card Album <span class="muted" id="collection-count" style="font-size:1rem"></span></h1>

    <section class="panel">
      <div class="filter-bar">
        <div><label for="filter-search">Search</label><input id="filter-search" type="search" placeholder="Monster name…"></div>
        <div><label for="filter-element">Element</label><select id="filter-element"></select></div>
        <div><label for="filter-race">Race</label><select id="filter-race"></select></div>
        <div><label for="filter-rarity">Rarity</label><select id="filter-rarity"></select></div>
        <div><label for="filter-sort">Sort</label>
          <select id="filter-sort">
            <option value="level">Level (high → low)</option>
            <option value="rarity">Rarity</option>
            <option value="name">Name (A→Z)</option>
            <option value="newest">Newest</option>
          </select>
        </div>
        <div><label for="filter-favorites">Show</label>
          <select id="filter-favorites">
            <option value="all">All cards</option>
            <option value="favorites">⭐ Favorites only</option>
          </select>
        </div>
      </div>
      <div class="card-grid" id="album-grid"></div>
      <p class="muted hidden" id="album-empty">No cards match these filters.</p>
    </section>
  </main>

  <dialog class="modal" id="card-modal">
    <button class="btn btn-sm btn-ghost modal-close" id="modal-close" type="button">✕</button>
    <div id="modal-body"></div>
  </dialog>

  <script type="module" src="js/pages/collection.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTHORXMITH</title>

    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
            text-align:center;
            padding:50px;
        }

        .card{
            max-width:500px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        img{
            border-radius:50%;
        }

        button{
            padding:10px 20px;
            cursor:pointer;
            margin:5px;
        }
    </style>
</head>
<body>

<div class="card">

    <h1>ARTHORXMITH</h1>

    <h2 id="playerName"></h2>

<div>
    Level:
    <span id="level">0</span>
</div>

<div>
    Gold:
    <span id="gold">0</span>
</div>

    <div id="guestArea">

        <p>กรุณาเข้าสู่ระบบ</p>

        <button id="loginBtn">
            Login with Google
        </button>

    </div>

    <div id="memberArea" style="display:none;">

        <img
            id="avatar"
            width="100"
            height="100"
        >

        <h2 id="displayName"></h2>

        <p id="email"></p>

        <p>
            Level :
            <span id="level">1</span>
        </p>

        <p>
            Gold :
            <span id="gold">1000</span>
        </p>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</div>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/firestore.js"></script>
<script type="module" src="js/auth.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — ARTHORXMITH</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚜️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-nav"></header>
  <main>
    <h1 class="page-title">🧙 Profile</h1>

    <section class="panel">
      <div class="profile-head" id="profile-head"></div>
      <div class="exp-bar" style="margin-top:16px"><div class="exp-fill" id="profile-exp" style="width:0%"></div></div>
      <p class="muted" id="profile-exp-caption" style="font-size:0.82rem;margin:6px 0 0"></p>
      <div class="stat-tiles" id="profile-tiles" style="margin-top:16px"></div>
    </section>

    <section class="panel">
      <h2>📜 Recent Battles</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Result</th><th>Difficulty</th><th>Rounds</th><th>Rewards</th><th>When</th></tr></thead>
          <tbody id="battle-history"></tbody>
        </table>
      </div>
      <p class="muted hidden" id="history-empty">No battles yet — go fight something!</p>
    </section>
  </main>
  <script type="module" src="js/pages/profile.js"></script>
</body>
</html>

<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0">

<title>
ARTHORXMITH Admin
</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.header{
    background:#fff;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.profile{
    display:flex;
    align-items:center;
    gap:15px;
}

.profile img{
    width:80px;
    height:80px;
    border-radius:50%;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                250px,
                1fr
            )
        );
    gap:20px;
}

.card{
    background:#fff;
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
    text-align:center;
}

.card a{
    text-decoration:none;
    display:block;
    padding:15px;
    margin-top:10px;
    background:#0d6efd;
    color:white;
    border-radius:10px;
}

.card a:hover{
    background:#0b5ed7;
}

.logout{
    margin-top:20px;
}

.logout button{
    border:none;
    background:#dc3545;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

.stat{
    font-size:24px;
    font-weight:bold;
    margin-top:10px;
}

</style>

</head>

<body>

<div class="container">


<div class="header">

    <div class="profile">

        <img id="avatar">

        <div>

            <h2 id="displayName">
                Loading...
            </h2>

            <div id="email"></div>

            <div>
                Role :
                <span id="role">
                    admin
                </span>
            </div>

        </div>

    </div>

</div>

<div class="grid">

    <div class="card">

        <h3>
            👥 Players
        </h3>

        <div
            id="playerCount"
            class="stat">

            0

        </div>

        <a href="players.html">

            จัดการผู้เล่น

        </a>

    </div>

    <div class="card">

        <h3>
            🐲 Monsters
        </h3>

        <div
            id="monsterCount"
            class="stat">

            0

        </div>

        <a href="monster-admin.html">

            จัดการ Monster

        </a>

    </div>

    <div class="card">

        <h3>
            📊 Statistics
        </h3>

        <a href="stats.html">

            ดูสถิติ

        </a>

    </div>

    <div class="card">

        <h3>
            ⚙️ Settings
        </h3>

        <a href="settings.html">

            ตั้งค่าเกม

        </a>

    </div>

    <div class="card">

        <h3>
            🎒 Collection
        </h3>

        <a href="collection.html">

            ดู Collection

        </a>

    </div>

    <div class="card">

        <h3>
            ⚔️ Battle
        </h3>

        <a href="battle.html">

            ทดสอบ Battle

        </a>

    </div>

</div>

<div class="logout">

    <button
        id="logoutBtn">

        Logout

    </button>

</div>


</div>

<script
    type="module"
    src="./js/admin.js">
</script>

</body>

</html>

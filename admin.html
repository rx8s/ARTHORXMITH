<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — ARTHORXMITH</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚜️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-nav"></header>
  <main>
    <h1 class="page-title">🛠️ Admin — Game Data</h1>

    <section class="panel">
      <div class="tabs">
        <button class="tab active" id="tab-monsters" type="button">🐲 Monsters</button>
        <button class="tab" id="tab-skills" type="button">✨ Skills</button>
      </div>
      <div class="row" style="margin-bottom:16px">
        <button class="btn btn-sm" id="btn-new" type="button">➕ New</button>
        <button class="btn btn-sm" id="btn-export" type="button">⬇️ Export JSON</button>
        <label class="btn btn-sm" style="margin:0">
          ⬆️ Import JSON <input id="import-file" type="file" accept=".json,application/json" class="hidden">
        </label>
      </div>

      <div class="admin-layout">
        <div class="admin-list table-wrap">
          <table>
            <thead id="admin-table-head"></thead>
            <tbody id="admin-table-body"></tbody>
          </table>
        </div>
        <div>
          <h2 id="editor-title">Editor</h2>
          <p class="muted" style="font-size:0.85rem">
            Edit the definition as JSON. Saving writes to Firestore and
            overrides the built-in data for every player.
          </p>
          <div class="field">
            <textarea class="json-area" id="editor-json" rows="18" spellcheck="false"></textarea>
          </div>
          <div class="field" id="artwork-field">
            <label>Artwork upload (sets the "image" field)</label>
            <input id="artwork-file" type="file" accept="image/*">
          </div>
          <div class="row">
            <button class="btn btn-primary" id="btn-save" type="button">💾 Save to Firestore</button>
            <button class="btn btn-danger" id="btn-delete" type="button">🗑️ Delete override</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="js/pages/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle — ARTHORXMITH</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚜️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-nav"></header>
  <main>
    <section class="battle-stage" id="battle-stage">
      <div class="turn-indicator" id="turn-indicator">ROUND 1</div>

      <div class="stage-slot player" id="slot-player">
        <div class="stage-sprite" id="sprite-player"></div>
        <div class="stage-info">
          <div class="stage-name"><span id="name-player"></span><span id="level-player"></span></div>
          <div class="bar bar-hp" id="hpbar-player"><div class="bar-fill" style="width:100%"></div><span class="bar-label" id="hplabel-player"></span></div>
          <div class="bar bar-sp" style="margin-top:4px"><div class="bar-fill" id="spfill-player" style="width:100%"></div><span class="bar-label" id="splabel-player"></span></div>
          <div class="stage-statuses" id="status-player"></div>
        </div>
        <div class="team-dots" id="dots-player"></div>
      </div>

      <div class="stage-vs">VS</div>

      <div class="stage-slot enemy" id="slot-enemy">
        <div class="stage-sprite" id="sprite-enemy"></div>
        <div class="stage-info">
          <div class="stage-name"><span id="name-enemy"></span><span id="level-enemy"></span></div>
          <div class="bar bar-hp" id="hpbar-enemy"><div class="bar-fill" style="width:100%"></div><span class="bar-label" id="hplabel-enemy"></span></div>
          <div class="bar bar-sp" style="margin-top:4px"><div class="bar-fill" id="spfill-enemy" style="width:100%"></div><span class="bar-label" id="splabel-enemy"></span></div>
          <div class="stage-statuses" id="status-enemy"></div>
        </div>
        <div class="team-dots" id="dots-enemy"></div>
      </div>
    </section>

    <section class="panel" id="action-panel" style="margin-top:16px">
      <div class="action-bar" id="action-bar">
        <button class="action-btn" data-action="attack" type="button"><span class="icon">⚔️</span>Attack</button>
        <button class="action-btn" data-action="skill" type="button"><span class="icon">✨</span>Skill</button>
        <button class="action-btn" data-action="defend" type="button"><span class="icon">🛡️</span>Defend</button>
        <button class="action-btn" data-action="item" type="button"><span class="icon">🧪</span>Item</button>
        <button class="action-btn" data-action="pass" type="button"><span class="icon">⏳</span>Pass</button>
      </div>
      <div class="skill-list hidden" id="skill-list"></div>
      <div class="item-list hidden" id="item-list"></div>
    </section>

    <div class="battle-log" id="battle-log"></div>
  </main>

  <script type="module" src="js/pages/battle.js"></script>
</body>
</html>

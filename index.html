<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0">

<title>
ARTHORXMITH
</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Arial,sans-serif;

    background:#f4f6f9;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;
}

.container{

    width:100%;

    max-width:800px;
}

.card{

    background:#ffffff;

    border-radius:20px;

    padding:30px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.1);

    text-align:center;
}

h1{

    margin-bottom:20px;

    color:#333;
}

#avatar{

    width:120px;

    height:120px;

    border-radius:50%;

    margin-bottom:15px;

    border:4px solid #eee;
}

button{

    padding:12px 20px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:16px;
}

#loginBtn{

    background:#4285F4;

    color:white;
}

#logoutBtn{

    background:#dc3545;

    color:white;
}

.menu{

    margin-top:20px;
}

.menu a{

    display:block;

    text-decoration:none;

    margin:10px 0;

    padding:12px;

    border-radius:10px;

    background:#f0f0f0;

    color:#333;

    font-weight:bold;
}

.menu a:hover{

    background:#e0e0e0;
}

.info{

    margin:10px 0;
}

.role{

    font-weight:bold;

    color:#007bff;
}

</style>

</head>

<body>

<div class="container">


<div class="card">

    <h1>
        ARTHORXMITH
    </h1>

    <img src="ARTHORXMITH.png">

    <!-- Guest -->

    <div id="guest">

        <p
            style="
            margin-bottom:20px;">
            กรุณาเข้าสู่ระบบ
        </p>

        <button id="loginBtn">

            Login with Google

        </button>

    </div>

    <!-- Member -->

    <div
        id="member"
        style="display:none;">

        <img
            id="avatar"
            src="">

        <h2
            id="displayName">
        </h2>

        <div
            class="info"
            id="email">
        </div>

        <div
            class="info">

            Role :

            <span
                id="role"
                class="role">
            </span>

        </div>

        <hr
            style="
            margin:20px 0;">

        <div
            id="menu"
            class="menu">

        </div>

        <hr
            style="
            margin:20px 0;">

        <button
            id="logoutBtn">

            Logout

        </button>

    </div>

</div>


</div>

<script
    type="module"
    src="./js/auth.js">
</script>

</body>

</html>

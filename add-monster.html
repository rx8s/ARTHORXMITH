<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Monster Admin</title>

<style>

body{
    font-family:Arial;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

input,select{
    padding:8px;
    margin:3px;
}

button{
    padding:8px 15px;
    cursor:pointer;
}

.card{
    border:1px solid #ddd;
    padding:10px;
    margin:10px 0;
}

</style>

</head>
<body>

<h1>Monster Admin</h1>

<h3>Monster Name</h3>

<input id="name" placeholder="Monster Name">

<br><br>

<select id="element">

<option>Neutral</option>
<option>Water</option>
<option>Earth</option>
<option>Fire</option>
<option>Wind</option>
<option>Poison</option>
<option>Holy</option>
<option>Shadow</option>
<option>Ghost</option>
<option>Undead</option>

</select>

<select id="race">

<option>Formless</option>
<option>Undead</option>
<option>Brute</option>
<option>Plant</option>
<option>Insect</option>
<option>Fish</option>
<option>Demon</option>
<option>Demi-Human</option>
<option>Angel</option>
<option>Dragon</option>

</select>

<hr>

<h3>Status</h3>

<input id="str" type="number" placeholder="STR">
<input id="agi" type="number" placeholder="AGI">
<input id="vit" type="number" placeholder="VIT">
<input id="int" type="number" placeholder="INT">
<input id="dex" type="number" placeholder="DEX">
<input id="luk" type="number" placeholder="LUK">

<br><br>

<button id="saveBtn">
Create Manual Monster
</button>

<button id="randomBtn">
Random Monster
</button>

<hr>

<h2>Monster List</h2>

<div id="monsterList"></div>

<script type="module" src="js/monsters.js"></script>

</body>
</html>

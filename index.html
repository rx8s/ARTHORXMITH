<!DOCTYPE html>
<html lang="th">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARTHORXMITH</title>

    <meta name="description" content="ARTHORXMITH - Monster Card Battle Game">

    <link rel="icon" href="assets/favicon.png">

    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    <!-- Loading -->

    <div id="loadingScreen" class="screen">
        <h1>ARTHORXMITH</h1>
        <p>Loading...</p>
    </div>

    <!-- Login -->

    <div id="loginScreen" class="screen hidden">

        <h1>ARTHORXMITH</h1>

        <button id="loginBtn">
            Login with Google
        </button>

    </div>

    <!-- Lobby -->

    <div id="lobbyScreen" class="screen hidden">

        <div id="playerInfo">

            <img
                id="playerAvatar"
                width="64"
                height="64"
            >

            <h2 id="playerName"></h2>

            <div>
                Lv.
                <span id="playerLevel">1</span>
            </div>

            <div>
                Gold :
                <span id="playerGold">0</span>
            </div>

        </div>

        <hr>

        <button id="btnCollection">
            Collection
        </button>

        <button id="btnDeck">
            Deck Builder
        </button>

        <button id="btnBattle">
            Battle
        </button>

        <button id="btnLogout">
            Logout
        </button>

    </div>

    <!-- Collection -->

    <div id="collectionScreen"
         class="screen hidden">

        <h2>Collection</h2>

        <div id="cardList"></div>

        <button class="backLobby">
            Back
        </button>

    </div>

    <!-- Deck -->

    <div id="deckScreen"
         class="screen hidden">

        <h2>Deck Builder</h2>

        <div id="deckSlots">

            <div id="slot1"></div>
            <div id="slot2"></div>
            <div id="slot3"></div>

        </div>

        <button id="saveDeckBtn">
            Save Deck
        </button>

        <button class="backLobby">
            Back
        </button>

    </div>

    <!-- Battle -->

    <div id="battleScreen"
         class="screen hidden">

        <h2>Battle Arena</h2>

        <div id="battleField">

            <div id="playerTeam"></div>

            <div id="enemyTeam"></div>

        </div>

        <div id="battleLog"></div>

        <button id="startBattleBtn">
            Start Battle
        </button>

        <button class="backLobby">
            Back
        </button>

    </div>

    <!-- Firebase -->

    <script type="module"
        src="js/firebase.js">
    </script>

    <script type="module"
        src="js/auth.js">
    </script>

    <script type="module"
        src="js/game.js">
    </script>

    <script type="module"
        src="js/battle.js">
    </script>

    <script type="module"
        src="js/cards.js">
    </script>

    <script type="module"
        src="js/deck.js">
    </script>

</body>
</html>
